services:
  trytv:
    # 构建上下文固定为文件所在目录：从任何路径执行 compose，都能找到 Dockerfile
    build:
      context: .
      dockerfile: Dockerfile
    # 版本管理：镜像 tag 与 package.json 的 version 保持一致
    # - 使用者：不设置 TRYTV_IMAGE 即拉取 ghcr.io/try-tang/trytv:latest（首次部署用 docker compose pull）
    # - 开发者：docker compose up -d --build 会在本地构建并打上同名 tag
    # - 需要固定版本时设置 TRYTV_IMAGE=ghcr.io/try-tang/trytv:<版本>
    image: ${TRYTV_IMAGE:-ghcr.io/try-tang/trytv:latest}
    container_name: trytv
    restart: unless-stopped
    ports:
      - "8080:8080"
    # 健康检查：容器内 /api/status 是免鉴权接口，200 即视为就绪
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # 观看历史在浏览器 IndexedDB、设置在 localStorage，与本卷无关；
    # 但求片/赞赏/站长通知/短剧清单/注册用户落在容器内 .data，必须挂卷，否则重建容器即丢
    volumes:
      # 用命名卷而不是 ./data 绑定挂载：容器内以非 root（uid 1000）运行，
      # 宿主机目录的属主往往对不上，写 site.json 会 EACCES / EPERM。
      # 需要直接看文件时：docker compose exec trytv ls -l /app/.data
      - trytv-data:/app/.data
    environment:
      # 必填：访问密码（在 .env 中设置，缺失时 compose 启动即报错提醒）
      - PASSWORD=${PASSWORD:?请在 .env 中设置 PASSWORD}
      # 业务数据目录（命名卷挂到这里），显式声明避免各家默认值差异
      - SITE_DATA_DIR=/app/.data
      # 可选：会话/代理签名密钥（多实例部署建议显式设置：openssl rand -hex 32）
      # - PROXY_SECRET=your-secret
      # 可选：Cookie Secure 策略覆盖（true=强制开启 / false=强制关闭；不设置时按请求协议自动推导，HTTP 部署无需配置）
      # - COOKIE_SECURE=true
      # 可选：预置采集站（JSON 数组），用户端自动出现且默认勾选
      # - DEFAULT_SOURCES=[{"name":"示例源","url":"https://example.com/api.php/provide/vod"}]
      # 可选：预置直播源（M3U 订阅，JSON 数组），epg 为可选节目单地址
      # - DEFAULT_LIVE_SOURCES=[{"name":"示例直播源","url":"https://example.com/list.m3u","epg":"https://example.com/epg.xml.gz"}]
      # 可选：预置数据源订阅（SourceList JSON 链接，一次下发点播源 + 直播源）
      # refreshDays 为该订阅的静默刷新周期初始值（1-365 天，缺省 1 天），可省略；用户在面板改过后以面板为准
      # - DEFAULT_SUBSCRIPTIONS=["https://example.com/sources.json", {"url":"https://example.com/list.json","name":"名称","refreshDays":10}]
      # 可选：首页推荐数据源默认值（douban / bangumi / hot-list），仅对未主动选择过的用户生效
      # - DEFAULT_RECOMMEND_SOURCE=douban
      # 可选：自建内网 IPTV 放行（对拉列表、测活、拉流三个阶段同时生效，默认关闭以维持 SSRF 防护）
      # - LIVE_ALLOW_PRIVATE=1
      # 可选：代理上游请求超时（毫秒）与重试次数
      # - REQUEST_TIMEOUT=8000
      # - MAX_RETRIES=1
      # 可选：每个搜索源最多抓取的页数（1-50，默认 5），调大会显著增加上游请求量
      # - SEARCH_MAX_PAGES=5
      # 可选：单个搜索源的总死线（毫秒，3s-60s，默认 10000），到点中断该源并标记超时
      # - SEARCH_SOURCE_TIMEOUT_MS=10000
      # 可选：代理请求 UA（豆瓣防盗链等场景）
      # - USER_AGENT=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/122.0.0.0 Safari/537.36
      # 可选：影视榜单推荐源（60s API）实例地址，官方公共实例有限流
      # - 60S_API_BASE=https://60s.crystelf.top
      # ——— 站点业务相关（求片 / 赞赏 / 通知 / 短剧 / 用户体系） ———
      # 私密短剧 /shorts 的进入口令；不设置时该页面返回 503
      # - SHORTS_PASSWORD=change-me-too
      # 私密短剧口令 cookie 的签名密钥；不设置时依次退回 SHORTS_PASSWORD / PASSWORD
      # - SHORTS_SECRET=
      # 业务数据目录已在上面 environment 里固定为 /app/.data（命名卷 trytv-data），无需再改

volumes:
  # 求片 / 赞赏留言 / 站长通知 / 私密短剧 / 注册用户全部落在这里
  # 备份：docker run --rm -v trytv_trytv-data:/d -v "$PWD":/b alpine tar czf /b/trytv-data.tar.gz -C /d .
  trytv-data:
