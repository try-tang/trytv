name: ci

# 每次 push / PR 到 main 都跑：类型检查 + ESLint + 构建。
#
# 用 npm 而不是 pnpm：仓库只保留 package-lock.json，Dockerfile 也用 npm ci，
# 三处（本地 / Docker / CI）走同一套依赖解析，避免两份锁文件漂移导致
# 「本地能跑、镜像构建失败」这类问题。

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci --no-audit --no-fund

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build
        env:
          # 构建期没有真实密码也不会失败，但显式给一个避免 503 分支干扰日志
          PASSWORD: ci-build-password
