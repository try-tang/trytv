name: docker-publish

# 推送版本 tag（如 v1.0.0）时构建并发布镜像到 GHCR；也可在 Actions 页面手动触发。
# 手动触发时用 package.json 的 version 作为镜像 tag，同时补 latest。
# 使用内置 GITHUB_TOKEN，无需任何 secrets。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: 决定镜像版本号
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # v1.0.0 -> 1.0.0
            VER="${GITHUB_REF_NAME#v}"
          else
            # 手动触发：读 package.json 的 version
            VER="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "镜像版本：$VER"

  build-amd64:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build & push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  build-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build & push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  merge:
    needs: [prepare, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 合并成多架构 manifest：版本号 + latest
      - name: merge manifests
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY}"
          VERSION="${{ needs.prepare.outputs.version }}"
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" \
            "$IMAGE:amd64" "$IMAGE:arm64"
          echo "已发布：$IMAGE:$VERSION 与 $IMAGE:latest"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
